[package]
name = "webtabs"
version = "0.2.4"
edition = "2024"
description = "Tiny, no-clutter web app tabs (WhatsApp, Gmail, Slack...) on the system webview"
license = "GPL-3.0-or-later"

[lib]
name = "webtabs_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
url = "2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
pangocairo = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
libappindicator = "0.9"
soup = { package = "soup3", version = "0.5" }
javascriptcore = { package = "javascriptcore-rs", version = "1.1" }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Com_Urlmon",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
