# Builds WebTabs for macOS (one app for Apple Silicon and Intel) and Linux
# (tarball + .deb on Ubuntu, a pacman package on Arch) and Windows (per-user MSI
# and a portable zip, unsigned).
# Push a tag like v0.2.0 to publish a GitHub Release with both; run it by hand
# (Actions › Release › Run workflow) to get the builds as artifacts only.
#
# macOS signing uses the self-signed "WebTabs Release Signing" identity from the
# MACOS_SIGNING_P12 (base64 .p12) and MACOS_SIGNING_PASSWORD secrets, so every
# release keeps the same identity and Keychain access allowed once keeps working.
# Without the secrets the app is ad-hoc signed. It is not notarized: macOS asks
# once per download (System Settings › Privacy & Security › Open Anyway).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Signing keychain
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::warning::No signing secrets; building ad-hoc signed."
            echo "WEBTABS_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "WEBTABS_SIGN_IDENTITY=WebTabs Release Signing" >> "$GITHUB_ENV"
      - name: Build
        env:
          WEBTABS_ARCHS: arm64 x86_64
          WEBTABS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          WEBTABS_BUILD: ${{ github.run_number }}
        run: bash scripts/build-macos.sh
      - name: Check
        run: |
          APP=target/release/WebTabs.app
          lipo -info "$APP/Contents/MacOS/WebTabs"
          codesign --verify --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|Signature"
      - name: Package
        run: ditto -c -k --keepParent target/release/WebTabs.app WebTabs-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WebTabs-macOS
          path: WebTabs-macOS.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev
      - name: Test
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
      - name: Build and package
        env:
          WEBTABS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          WEBTABS_REQUIRE_DEB: "1"
        run: bash scripts/package-linux.sh
      - name: Check packages
        run: |
          tar tzf target/dist/webtabs-*-linux-x86_64.tar.gz
          dpkg-deb --info target/dist/webtabs_*_amd64.deb
          sudo apt-get install -y ./target/dist/webtabs_*_amd64.deb
          ! ldd /usr/bin/webtabs | grep "not found"
          (cd target/dist && sha256sum -c SHA256SUMS-linux)
      - uses: actions/upload-artifact@v4
        with:
          name: webtabs-linux-x86_64
          path: |
            target/dist/webtabs-*.tar.gz
            target/dist/webtabs_*.deb
            target/dist/SHA256SUMS-linux

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed git cargo webkit2gtk-4.1 gtk3 libsoup3 \
            libayatana-appindicator
          useradd -m builder
          git config --system --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Build package
        env:
          WEBTABS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          chown -R builder .
          su builder -c "WEBTABS_VERSION='$WEBTABS_VERSION' bash scripts/package-arch.sh"
      - name: Check package
        run: |
          pacman -U --noconfirm target/dist/webtabs-*.pkg.tar.zst
          pacman -Ql webtabs
          ! ldd /usr/bin/webtabs | grep "not found"
          (cd target/dist && sha256sum -c SHA256SUMS-arch)
      - uses: actions/upload-artifact@v4
        with:
          name: webtabs-arch-x86_64
          path: |
            target/dist/webtabs-*.pkg.tar.zst
            target/dist/SHA256SUMS-arch

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          cargo test --locked
          if ($LASTEXITCODE) { exit 1 }
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { exit 1 }
      - name: WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and package
        env:
          WEBTABS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/package-windows.ps1
      - name: WebView2 Runtime
        # The MSI refuses to install without it (as on a bare Windows 10).
        run: |
          $key = 'SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty "HKLM:\$key" -ErrorAction SilentlyContinue).pv
          if ($pv -and $pv -ne '0.0.0.0') { "WebView2 Runtime $pv"; exit 0 }
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile "$env:TEMP\wv2.exe"
          Start-Process "$env:TEMP\wv2.exe" -ArgumentList '/silent /install' -Wait
      - name: Check installer
        run: ./scripts/check-windows-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: webtabs-windows-x64
          path: |
            target/dist/WebTabs-*-windows-x64.msi
            target/dist/webtabs-*-windows-x64.zip
            target/dist/SHA256SUMS-windows

  release:
    if: github.ref_type == 'tag'
    needs: [macos, linux, arch, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" WebTabs-macOS.zip webtabs-*.tar.gz webtabs_*.deb \
            SHA256SUMS-linux webtabs-*.pkg.tar.zst SHA256SUMS-arch \
            WebTabs-*-windows-x64.msi webtabs-*-windows-x64.zip SHA256SUMS-windows \
            --repo "$GITHUB_REPOSITORY" --title "WebTabs $GITHUB_REF_NAME" --generate-notes
